<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modo oscuro</title>
  <style>
    /* Tema claro (por defecto) */
    body {
      font-family: sans-serif;
      background-color: #ffffff;
      color: #111111;
      padding: 2rem;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Tema oscuro: se activa cuando <body> tiene la clase "oscuro" */
    body.oscuro {
      background-color: #1a1a2e;
      color: #e0e0e0;
    }

    button {
      font-size: 1rem;
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Mi página</h1>
  <p>Este es un párrafo de ejemplo para ver cómo se ve el texto en cada tema.</p>
  <button id="btn-tema">Activar modo oscuro</button>

  <script>
    const btn = document.querySelector("#btn-tema");
    const tema = localStorage.getItem("tema");
        if (tema === "true") {
            document.body.classList.add("oscuro");
}
    btn.addEventListener("click", () => {
    const tema = document.body.classList.toggle("oscuro");
          btn.textContent = tema ? "Activar modo claro" : "Activar modo oscuro";
                  localStorage.setItem("tema",tema);

    });
  </script>
</body>
</html>
