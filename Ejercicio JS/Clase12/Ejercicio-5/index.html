<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jugadores favoritos</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .formulario {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .formulario input {
      font-size: 1rem;
      padding: 0.4rem 0.6rem;
    }

    .formulario button {
      font-size: 1rem;
      padding: 0.5rem;
      cursor: pointer;
    }

    #lista {
      list-style: none;
      padding: 0;
      margin-bottom: 1rem;
    }

    #lista li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.5rem 0;
      border-bottom: 1px solid #ddd;
    }

    #lista li .info {
      display: flex;
      flex-direction: column;
    }

    #lista li .posicion {
      font-size: 0.85rem;
      color: #666;
    }

    #lista li button {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: #c0392b;
    }

    #btn-limpiar {
      font-size: 0.9rem;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      color: #c0392b;
      border: 1px solid #c0392b;
      background: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Jugadores favoritos</h1>

  <div class="formulario">
    <input type="text" id="input-nombre" placeholder="Nombre del jugador">
    <input type="text" id="input-posicion" placeholder="Posición (ej: Delantero)">
    <button id="btn-agregar">Agregar</button>
  </div>

  <ul id="lista"></ul>

  <button id="btn-limpiar">Limpiar todo</button>

<script>
  function renderizarLista() {
    const jugadores = JSON.parse(localStorage.getItem("jugadores")) || [];
    const lista = document.getElementById("lista");

    lista.innerHTML = "";

    jugadores.forEach((jugador, indice) => {
      const li = document.createElement("li");

      const info = document.createElement("div");
      info.className = "info";

      const nombre = document.createElement("span");
      nombre.textContent = jugador.nombre;

      const posicion = document.createElement("span");
      posicion.className = "posicion";
      posicion.textContent = jugador.posicion;

      info.appendChild(nombre);
      info.appendChild(posicion);

      const boton = document.createElement("button");
      boton.textContent = "✕";

      boton.addEventListener("click", () => {
        jugadores.splice(indice, 1);
        localStorage.setItem("jugadores", JSON.stringify(jugadores));
        renderizarLista();
      });

      li.appendChild(info);
      li.appendChild(boton);

      lista.appendChild(li);
    });
  }

  document.querySelector("#btn-agregar").addEventListener("click", () => {
    const inputNombre = document.getElementById("input-nombre");
    const inputPosicion = document.getElementById("input-posicion");

    const nombre = inputNombre.value.trim();
    const posicion = inputPosicion.value.trim();

    if (nombre === "" || posicion === "") {
      alert("Completá todos los campos.");
      return;
    }

    const jugadores = JSON.parse(localStorage.getItem("jugadores")) || [];

    jugadores.push({
      nombre: nombre,
      posicion: posicion
    });

    localStorage.setItem("jugadores", JSON.stringify(jugadores));

    renderizarLista();

    inputNombre.value = "";
    inputPosicion.value = "";
  });

  document.querySelector("#btn-limpiar").addEventListener("click", () => {
    localStorage.removeItem("jugadores");
    renderizarLista();
  });

  // Renderizar al cargar la página
  renderizarLista();
</script>
</body>
</html>
